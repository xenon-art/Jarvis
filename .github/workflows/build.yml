name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          set -e
          ZIP=$(ls *.zip | head -1)
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          ROOT=$(dirname "$(find _src -name settings.gradle.kts | head -1)")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" Jarvis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: Jarvis.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" Jarvis.apk --title "Jarvis build ${{ github.run_number }}" --notes "Install Jarvis.apk"
